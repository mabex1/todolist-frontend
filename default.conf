server {
    listen 80;
    server_name localhost;

    # 1. Раздача статики (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Проксирование запросов к API (бэкенд)
    location /tasks/ {
        # Убедись, что имя совпадает с именем контейнера API в docker-compose.yml
        proxy_pass http://todolist_api:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Проксирование запросов к Adminer
    location /adminer/ {
        # Adminer обычно слушает на порту 8080 внутри контейнера
        proxy_pass http://todolist_adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}